%%META%%
<div class="prompt-label">Listen. What did you hear, and what does it mean?</div>
<div class="listen">
  <div class="listen-btn listen-normal">{{tts fr_FR:Speak}}<span>Play</span></div>
  <div class="listen-btn listen-slow">{{tts fr_FR speed=0.7:Speak}}<span>Slow</span></div>
</div>
<hr id="answer">
<div class="french">{{French}}</div>
<div class="english listen-en">{{English}}</div>
