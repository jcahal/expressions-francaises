<div class="voices">
  <div class="voice">
    <div class="voice-name">Male voice</div>
    <div class="listen">
      <div class="listen-btn listen-normal">{{AudioMale}}<span>Play</span></div>
      <div class="listen-btn listen-slow">{{AudioMaleSlow}}<span>Slow</span></div>
    </div>
  </div>
  <div class="voice">
    <div class="voice-name">Female voice</div>
    <div class="listen">
      <div class="listen-btn listen-normal">{{AudioFemale}}<span>Play</span></div>
      <div class="listen-btn listen-slow">{{AudioFemaleSlow}}<span>Slow</span></div>
    </div>
  </div>
</div>
